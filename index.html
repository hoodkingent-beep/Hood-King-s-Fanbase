<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hood King Community</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root { --red: #dc143c; --ink: #000000; --panel: #0a0a0a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Raleway", sans-serif; background:#000; }
    .app-shell { width: 100%; min-height: 100vh; position: relative; overflow: hidden; background: #000; color:#fff; }
    .gold-line { background: linear-gradient (90deg, transparent, #ffffff, transparent); height: 1px; }
    input:focus { outline: 2px solid #dc143c; outline-offset: 2px; }
  </style>
</head>

<body>
  <div class="app-shell">
    <main class="w-full px-5 pb-10 pt-10 sm:px-8 lg:px-12">
      <section class="mx-auto max-w-2xl overflow-hidden border border-white/10 bg-[#000000] p-8 shadow-2xl shadow-black/40">
        <img src="Clean%20logo%20edges.png" alt="Hood King Entertainment logo" class="mx-auto w-48 h-auto">
        <p class="mb-3 text-xs font-bold uppercase tracking-[0.23em]" style="color:#dc143c;">The inner circle</p>
        <h1 class="text-4xl font-extrabold uppercase leading-[.93] tracking-[-0.045em]">Hood King Community</h1>
        <div class="gold-line my-6 w-24"></div>
        <p class="leading-relaxed text-white/70">
          Your direct line to rare drops, real stories, and the people moving culture forward.
        </p>

        <div class="mt-8">
          <form id="signup-form" class="space-y-3" novalidate>
            <label class="block text-xs font-bold uppercase tracking-[0.15em]" for="name">Your name</label>
            <input id="name" name="name" type="text" autocomplete="name" required
              class="min-w-0 w-full border border-white/30 bg-black/50 px-4 py-4 text-sm text-white placeholder:text-white/40"
              placeholder="Your name" style="background:#0f0f0f;">

            <label class="block text-xs font-bold uppercase tracking-[0.15em]" for="email">Your email address</label>
            <div class="flex flex-col gap-3 sm:flex-row">
              <input id="email" name="email" type="email" autocomplete="email" required
                class="min-w-0 flex-1 border border-white/30 bg-black/50 px-4 py-4 text-sm text-white placeholder:text-white/40"
                placeholder="name@email.com" style="background:#0f0f0f;">

              <button id="join-button"
                class="inline-flex min-h-[52px] items-center justify-center gap-2 px-6 py-3 text-sm font-extrabold uppercase tracking-[0.12em] transition hover:brightness-110 disabled:cursor-wait disabled:opacity-60"
                type="submit" style="background:#dc143c; color:#000;">
                <span class="button-label">Join now</span>
                <i data-lucide="arrow-up-right" aria-label="Submit" style="width:17px;height:17px"></i>
              </button>
            </div>

            <p id="form-message" class="min-h-[20px] text-sm" aria-live="polite"></p>
          </form>

          <div id="signup-success" class="hidden border border-white/30 bg-white/5 p-5 mt-4" aria-live="polite">
            <div class="flex gap-3">
              <i data-lucide="badge-check" aria-label="Success" class="mt-0.5 shrink-0 text-white" style="width:22px;height:22px"></i>
              <div>
                <h2 class="font-bold text-xl">You're on the list.</h2>
                <p class="mt-1 leading-relaxed text-white/70">Welcome to the inner circle.</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const SUPABASE_URL = "https://mpzzelmlngxjthhpgxwx.supabase.co";
      const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


      const form = document.getElementById("signup-form");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const button = document.getElementById("join-button");
      const message = document.getElementById("form-message");
      const success = document.getElementById("signup-success");

      // Guard: if any element is missing, show a clear message
      if (!form || !nameInput || !emailInput || !button || !message || !success)const missing = [];
if (!form) missing.push("signup-form");
if (!nameInput) missing.push("name");
if (!emailInput) missing.push("email");
if (!button) missing.push("join-button");
if (!message) missing.push("form-message");
if (!success) missing.push("signup-success");

if (missing.length) {
  console.error("Missing element IDs:", missing.join(", "));
  if (message) message.textContent = "Setup error: missing " + missing.join(", ");
  return;
}

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();

        if (!name) { message.textContent = "Enter your name to join."; nameInput.focus(); return; }
        if (!email || !emailInput.validity.valid) { message.textContent = "Enter a valid email address."; emailInput.focus(); return; }

        button.disabled = true;
        button.querySelector(".button-label").textContent = "Saving...";
        message.textContent = "";

        const { error } = await supabase
          .from("FanBase")
          .insert([{ name, email }]);

        if (error) {
          console.error("Supabase insert error:", error);
          message.textContent =
            error.code === "23505"
              ? "That email is already on the list."
              : (error.message || "Your spot wasn't saved. Please try again.");

          button.disabled = false;
          button.querySelector(".button-label").textContent = "Join now";
          return;
        }

        // Optional: clear inputs
        nameInput.value = "";
        emailInput.value = "";

        form.classList.add("hidden");
        success.classList.remove("hidden");
      });
    });
  </script>
</body>
</html>
