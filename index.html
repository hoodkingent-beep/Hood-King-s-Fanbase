<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hood King Community</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="browser.png">

  <style>
    :root { --red: #dc143c; --ink: #000000; --panel: #0a0a0a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Raleway", sans-serif; background:#000; }
    .app-shell { width: 100%; min-height: 100vh; position: relative; overflow: hidden; background: #000; color:#fff; }
    .gold-line { background: linear-gradient(90deg, transparent, #ffffff, transparent); height: 1px; }
    input:focus, select:focus { outline: 2px solid #dc143c; outline-offset: 2px; }
  </style>
</head>

<body>
  <div class="app-shell">
    <main class="w-full px-5 pb-10 pt-10 sm:px-8 lg:px-12">
      <section class="mx-auto max-w-2xl overflow-hidden border border-white/10 bg-[#000000] p-8 shadow-2xl shadow-black/40">
        <img src="logo.png" alt="Hood King Entertainment logo" class="mx-auto w-48 h-auto">

        <p class="mb-3 text-xs font-bold uppercase tracking-[0.23em]" style="color:#dc143c;">The inner circle</p>
        <h1 class="text-4xl font-extrabold uppercase leading-[.93] tracking-[-0.045em]">Hood King Community</h1>
        <div class="gold-line my-6 w-24"></div>
        <p class="leading-relaxed text-white/70">
          Your direct line to rare drops, real stories, and the people moving culture forward.
        </p>

        <div class="mt-8">
          <form id="signup-form" class="space-y-3" novalidate>
            <label class="block text-xs font-bold uppercase tracking-[0.15em]" for="name">Your name</label>
            <input id="name" name="name" type="text" autocomplete="name" required
              class="min-w-0 w-full border border-white/30 bg-black/50 px-4 py-4 text-sm text-white placeholder:text-white/40"
              placeholder="Your name" style="background:#0f0f0f;">

            <label class="block text-xs font-bold uppercase tracking-[0.15em]" for="email">Your email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required
              class="min-w-0 w-full border border-white/30 bg-black/50 px-4 py-4 text-sm text-white placeholder:text-white/40"
              placeholder="name@email.com" style="background:#0f0f0f;">

            <label class="block text-xs font-bold uppercase tracking-[0.15em]" for="phone">Phone (optional)</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel"
              class="min-w-0 w-full border border-white/30 bg-black/50 px-4 py-4 text-sm text-white placeholder:text-white/40"
              placeholder="(614) 555-1234" style="background:#0f0f0f;">

            <label class="block text-xs font-bold uppercase tracking-[0.15em]" for="interests">What are you here for?</label>
            <select id="interests" name="interests"
              class="min-w-0 w-full border border-white/30 bg-black/50 px-4 py-4 text-sm text-white"
              style="background:#0f0f0f;">
              <option value="" selected>Choose one (optional)</option>
              <option value="music-drops">Music drops</option>
              <option value="events-shows">Events & shows</option>
              <option value="merch">Merch</option>
              <option value="behind-the-scenes">Behind the scenes</option>
              <option value="artist-updates">Artist updates</option>
            </select>

            <label class="flex items-start gap-3 text-sm text-white/70">
              <input id="consent" name="consent" type="checkbox" required class="mt-1">
              <span>I agree to receive updates from Hood King Entertainment.</span>
            </label>

            <button id="join-button"
              class="inline-flex w-full min-h-[52px] items-center justify-center gap-2 px-6 py-3 text-sm font-extrabold uppercase tracking-[0.12em] transition hover:brightness-110 disabled:cursor-wait disabled:opacity-60"
              type="submit" style="background:#dc143c; color:#000;">
              <span class="button-label">Join now</span>
              <i data-lucide="arrow-up-right" aria-label="Submit" style="width:17px;height:17px"></i>
            </button>

            <p id="form-message" class="min-h-[20px] text-sm" aria-live="polite"></p>
          </form>

          <div id="signup-success" class="hidden border border-white/30 bg-white/5 p-5 mt-4" aria-live="polite">
            <div class="flex gap-3">
              <i data-lucide="badge-check" aria-label="Success" class="mt-0.5 shrink-0 text-white" style="width:22px;height:22px"></i>
              <div>
                <h2 class="font-bold text-xl">You're on the list.</h2>
                <p class="mt-1 leading-relaxed text-white/70">Welcome to the inner circle. Redirecting…</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const SUPABASE_URL = "https://mpzzelmlngxjthhpgxwx.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wenplbG1sbmd4anRoaHBneHd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDc3OTYsImV4cCI6MjEwMTUyMzc5Nn0.F7GGMgDmfbIH2D_PJpq9z6jPGAPJRpy1-m0vHxKzZLs";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const form = document.getElementById("signup-form");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const phoneInput = document.getElementById("phone");
      const interestsInput = document.getElementById("interests");
      const consentInput = document.getElementById("consent");
      const button = document.getElementById("join-button");
      const message = document.getElementById("form-message");
      const success = document.getElementById("signup-success");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const phone = phoneInput.value.trim() || null;
        const interests = interestsInput.value || null;

        if (!name) { message.textContent = "Enter your name to join."; nameInput.focus(); return; }
        if (!email || !emailInput.validity.valid) { message.textContent = "Enter a valid email address."; emailInput.focus(); return; }
        if (!consentInput.checked) { message.textContent = "Please check the consent box to join."; consentInput.focus(); return; }

        button.disabled = true;
        button.querySelector(".button-label").textContent = "Saving...";
        message.textContent = "";

        const consent = "yes";

        const { error } = await supabase
          .from("FanBase")
          .insert([{ name, email, phone, interests, consent }]);

        if (error) {
          console.log("Supabase error:", error);
          message.textContent = (error.code === "23505")
            ? "That email is already on the list."
            : "Your spot wasn't saved. Please try again.";

          button.disabled = false;
          button.querySelector(".button-label").textContent = "Join now";
          return;
        }

        form.classList.add("hidden");
        success.classList.remove("hidden");

        // Redirect after success (edit this URL to whatever you want)
        setTimeout(() => {
          window.location.href = "https://hoodkingent-beep.github.io/Hood-King-s-Fanbase/thank-you.html";
        }, 1200);
      });
    });
  </script>
</body>
</html>
